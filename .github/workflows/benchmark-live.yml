name: benchmark live

# The Bench-1 plumbing smoke against a real Claude Code, run as automated
# evidence and nothing more. Every record is stamped non-publishable and
# automated (`live-run --plumbing --ci-live`), so no number from this lane can
# be quoted as a result; a publishable run still needs an operator, an attested
# disposable instance, and no automation. This check is informational: it is
# not in the ruleset's required checks and never blocks a pull request. It is
# not `continue-on-error` either, because a red run is meant to be seen.
on:
  pull_request:
    branches: [main]
    paths:
      - 'evals/benchmark/**'
      - '.github/workflows/benchmark-live.yml'
  workflow_dispatch:

concurrency:
  group: benchmark-live-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default-deny; the job opts into only what it needs.
permissions: {}

jobs:
  live:
    name: benchmark live (plumbing smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # A fork pull request sees no repository secret. That is a skip that says
      # so on the run page, never a failure and never a fake pass: the step
      # summary states that no live attempt ran.
      - name: Check for the repository secret
        id: gate
        env:
          TOKEN_PRESENT: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          echo "live=$TOKEN_PRESENT" >> "$GITHUB_OUTPUT"
          if [ "$TOKEN_PRESENT" != "true" ]; then
            cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Bench-1 live plumbing smoke: skipped

          The repository secret `CLAUDE_CODE_OAUTH_TOKEN` is not available to this run
          (fork pull request, or the secret is unset). No live attempt ran.
          SUMMARY
          fi
      - name: Check the interpreter floor
        if: steps.gate.outputs.live == 'true'
        run: |
          python3 --version
          python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 12) else 1)' || {
            echo "::error title=python::evals/benchmark needs Python 3.12 or later (scipy 1.18)"
            exit 1
          }
      # The package's own closure, hash-pinned, into a throwaway venv. Every
      # `cli` call below runs that venv's interpreter.
      - name: Bench-1 dependencies
        if: steps.gate.outputs.live == 'true'
        timeout-minutes: 5
        run: |
          python3 -m venv "$RUNNER_TEMP/bench1-venv"
          "$RUNNER_TEMP/bench1-venv/bin/python" -m pip install --quiet --require-hashes \
            --only-binary=:all: -r evals/benchmark/requirements-test.txt
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.gate.outputs.live == 'true'
        with:
          node-version: '24'
      # Pinned to the exact version the smoke manifest's `pins.harness_version`
      # names, so the record says which CLI it measured.
      - name: Install Claude Code
        if: steps.gate.outputs.live == 'true'
        run: |
          npm i -g @anthropic-ai/claude-code@2.1.263
          claude --version
      # The secret reaches this one step only. The executor passes it into the
      # child as the manifest's credential seam and nothing else from this
      # environment; the budget cap, the wall-clock cap, and the job timeout
      # are the supervision a human would otherwise be.
      - name: Live run (plumbing, non-publishable)
        if: steps.gate.outputs.live == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          "$RUNNER_TEMP/bench1-venv/bin/python" -m evals.benchmark.cli live-run \
            --manifest evals/benchmark/fixtures/live/smoke-manifest.json \
            --out "$RUNNER_TEMP/bench1-live" --plumbing --ci-live
      # `regress` warns on the checks tab where the run is worse than the
      # committed baseline and exits 0 whatever it finds; the lane stays
      # informational.
      - name: Verify, summary, regress
        if: steps.gate.outputs.live == 'true'
        run: |
          set -o pipefail
          run="$RUNNER_TEMP/bench1-live"
          python="$RUNNER_TEMP/bench1-venv/bin/python"
          echo "::group::verify (hidden verifiers re-run over the finished run)"
          "$python" -m evals.benchmark.cli verify --run "$run"
          echo "::endgroup::"
          "$python" -m evals.benchmark.cli summary --run "$run" | tee "$RUNNER_TEMP/bench1-live-summary.txt"
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Bench-1 live plumbing smoke: non-publishable evidence

          Real Claude Code attempts under `--plumbing --ci-live`. Every record is stamped
          automated and non-publishable; this proves the chain runs, and no number here
          is a result or a savings claim.

          SUMMARY
          {
            echo '```text'
            cat "$RUNNER_TEMP/bench1-live-summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          "$python" -m evals.benchmark.cli regress --run "$run" \
            --baseline evals/benchmark/fixtures/live/baseline.json
      # report.json is the only publishable projection and the only thing
      # retained. Records, transcripts, and worktrees stay on the runner and
      # die with it.
      - name: Upload report.json
        if: steps.gate.outputs.live == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench1-live-report
          path: ${{ runner.temp }}/bench1-live/report.json
          if-no-files-found: error
          retention-days: 14
