name: benchmark canary

# Seeded product-health experiment: four tasks, two arms, three repeats.
# A report may be incomplete or invalid even when its workflow succeeds.
on:
  schedule:
    # 07:17 UTC. Off the hour, because every workflow scheduled on one competes
    # for the same runners and drifts.
    - cron: '17 7 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'evals/benchmark/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/benchmark-canary.yml'
      - '.github/workflows/benchmark-shelf.yml'
  workflow_dispatch:

permissions: {}

jobs:
  canary:
    uses: ./.github/workflows/benchmark-shelf.yml
    permissions:
      contents: read
      checks: write
    secrets: inherit
    with:
      manifest: evals/benchmark/fixtures/live/canary-manifest.json
      lane: benchmark-canary
      check_name: benchmark canary (nightly)
      timeout_minutes: 180
      budget_note: >-
        Bench-2 canary: four tasks, control versus the shelf arm, three repeats
        (24 planned attempts). This is a product health measurement, not the
        full team workload. Read coverage, verified completions and consumer
        time/token costs above; incomplete runs provide no product headline.
