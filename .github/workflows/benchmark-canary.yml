name: benchmark canary

# The nightly lane. Four tasks, `off` against the shelf arm, three attempts an
# arm: 24 attempts, about 5.69 USD a run at the 0.237 USD an attempt the pilot
# measured. It is a health check on the whole chain against a real corpus, not
# the evidence run; the headline lane is that.
#
# Nightly, on demand, and on a pull request that could move the number.
#
# The pull-request lane is a REGRESSION WARNING, never a gate. It is not a
# required check, and the shelf lane it calls reports `neutral` rather than
# `failure` for any run that produced no quotable number, so a PR is blocked by
# nothing here. Only a run that produced no report at all goes red, which is
# the case where the change under review broke the harness itself.
#
# The path filter is what keeps it honest. A live lane spends real money and
# about 17 minutes, so a docs-only or skills-only pull request must not pay for
# it; a change to the product, the benchmark package or this lane's own
# plumbing is exactly what can move a measurement, so those do.
on:
  schedule:
    # 07:17 UTC. Off the hour, because every workflow scheduled on one competes
    # for the same runners and drifts.
    - cron: '17 7 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'evals/benchmark/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/benchmark-canary.yml'
      - '.github/workflows/benchmark-shelf.yml'
  workflow_dispatch:

permissions: {}

jobs:
  canary:
    uses: ./.github/workflows/benchmark-shelf.yml
    permissions:
      contents: read
      checks: write
    secrets: inherit
    with:
      manifest: evals/benchmark/fixtures/live/canary-manifest.json
      lane: benchmark-canary
      check_name: benchmark canary (nightly)
      timeout_minutes: 180
      budget_note: >-
        Bench-2 canary: four tasks, control versus the shelf arm, three repeats
        (24 planned attempts). This is a product health measurement, not the
        full team workload. Read coverage, verified completions and consumer
        time/token costs above; incomplete runs provide no product headline.
