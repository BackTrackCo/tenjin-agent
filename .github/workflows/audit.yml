name: audit

# Daily `pnpm audit --audit-level=high` on main. Advisories publish on their own
# schedule, not ours: CI's audit is warn-only so drift can't red unrelated PRs,
# and Dependabot opens no PR for a pnpm transitive dependency held by an
# override, so without this the first hard failure was release.yml's
# pre-publish gate, on release day. A hit opens (or updates) one fix PR, and a
# clean run closes it (scripts/open-audit-fix-pr.sh). The run SUCCEEDS once that
# PR is open and fails only when pnpm can't fix the advisory by itself, which is
# the case that needs a person.
on:
  schedule:
    - cron: '41 7 * * *' # 07:41 UTC daily, off the top-of-hour congestion.
  workflow_dispatch:

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  # Never cancel mid-push.
  cancel-in-progress: false

# Default-deny; the job opts into only what it needs.
permissions: {}

jobs:
  audit-fix:
    name: audit (auto-open fix PR)
    # workflow_dispatch lets the operator pick any ref; bind to main so a
    # dispatch off a stale branch can't spend the write token (same guard as
    # release.yml).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the bot/audit-fix branch
      pull-requests: write # open/update the fix PR
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # PRs opened with the default GITHUB_TOKEN don't trigger downstream
      # workflows (Actions anti-recursion), which would leave the fix PR with no
      # CI. Same app-token mechanism release.yml uses.
      - name: Mint release-bot installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The script pushes via the git CLI, which reads this persisted token.
          token: ${{ steps.app-token.outputs.token }}
          # Full history: a shallow clone can't push the bot branch.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No `cache: pnpm`: a runner holding a write token must not deserialize the
      # cache that ci.yml writes from untrusted PR runs (same as release.yml).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Open or update the fix PR
        run: bash scripts/open-audit-fix-pr.sh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
