name: audit

# Daily `pnpm audit --audit-level=high` on main. Advisories publish on their own
# schedule, not ours: CI's audit is warn-only so drift can't red unrelated PRs,
# and Dependabot opens no PR for a pnpm transitive dependency held by an
# override, so without this the first hard failure was release.yml's
# pre-publish gate, on release day. A hit opens (or updates) one fix PR
# (scripts/open-audit-fix-pr.sh). The run SUCCEEDS once that PR is open and
# fails only when pnpm can't fix the advisory by itself, which is the case that
# needs a person.
on:
  schedule:
    - cron: '41 7 * * *' # 07:41 UTC daily, off the top-of-hour congestion.
  workflow_dispatch:

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  # Never cancel mid-push.
  cancel-in-progress: false

# Default-deny; the job opts into only what it needs.
permissions: {}

jobs:
  audit-fix:
    name: audit (auto-open fix PR)
    # workflow_dispatch lets the operator pick any ref; bind to main so a
    # dispatch off a stale branch can't spend the write token (same guard as
    # release.yml and skill-drift.yml).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the bot/audit-fix branch
      pull-requests: write # open/update the fix PR
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      # PRs opened with the default GITHUB_TOKEN don't trigger downstream
      # workflows (Actions anti-recursion), which would leave the fix PR with no
      # CI. Same app-token mechanism release.yml and skill-drift.yml use.
      - name: Mint release-bot installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # The script pushes via the git CLI, which reads this persisted token.
          token: ${{ steps.app-token.outputs.token }}
          # Full history: a shallow clone can't push the bot branch.
          fetch-depth: 0

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      # No `cache: pnpm`: a runner holding a write token must not deserialize the
      # cache that ci.yml writes from untrusted PR runs (same as release.yml).
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Open or update the fix PR
        run: bash scripts/open-audit-fix-pr.sh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
