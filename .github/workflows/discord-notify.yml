name: Discord creation notifications

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions: {}

jobs:
  notify:
    if: github.repository == 'BackTrackCo/tenjin-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Keep this metadata-only: never check out or execute PR code with this trigger.
      - name: Notify Discord
        env:
          DISCORD_PR_WEBHOOK_URL: ${{ secrets.DISCORD_PR_WEBHOOK_URL }}
          DISCORD_ISSUE_WEBHOOK_URL: ${{ secrets.DISCORD_ISSUE_WEBHOOK_URL }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request_target" ]; then
            DISCORD_WEBHOOK_URL="$DISCORD_PR_WEBHOOK_URL"
            DISCORD_SECRET_NAME=DISCORD_PR_WEBHOOK_URL
          else
            DISCORD_WEBHOOK_URL="$DISCORD_ISSUE_WEBHOOK_URL"
            DISCORD_SECRET_NAME=DISCORD_ISSUE_WEBHOOK_URL
          fi

          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::Set the ${DISCORD_SECRET_NAME} Actions secret before enabling notifications."
            exit 1
          fi

          jq -c '
            (.pull_request // .issue) as $item |
            {
              content: (
                (if .pull_request then "New PR" else "New issue" end) +
                " — " + .repository.full_name +
                " #" + ($item.number | tostring) +
                "\n" + $item.title +
                "\n" + $item.html_url
              ),
              allowed_mentions: {parse: []}
            }
          ' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/discord-notification.json"

          curl --fail --silent --show-error --max-time 30 \
            --header "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/discord-notification.json" \
            --output /dev/null \
            "${DISCORD_WEBHOOK_URL}?wait=true"
