name: benchmark

# Bench-1 (evals/benchmark/) is stdlib Python with no model, no network and no
# spend, and it is eval-only: nothing it covers ships in the CLI. It therefore
# gets its own lane instead of riding the required CI check, so a benchmark
# change can never red a release PR and a CLI change never waits on it. The
# paths filter means this workflow is the only thing a benchmark-only PR runs.
on:
  pull_request:
    branches: [main]
    paths:
      - 'evals/benchmark/**'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default-deny; the job opts into only what it needs.
permissions: {}

jobs:
  benchmark:
    name: benchmark (offline self-test and fake run)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # No setup-python and no pnpm install: the suite is standard library only
      # and the runner's python3 is the interpreter an operator runs locally.
      # The floor is 3.11; a runner older than that is a red run, not a skip,
      # because a skipped gate reads the same as a passing one.
      - name: Check the interpreter floor
        run: |
          python3 --version
          python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 11) else 1)' || {
            echo "::error title=python::evals/benchmark needs Python 3.11 or later"
            exit 1
          }
      # selftest.py enforces its own 60-second wall-clock budget and exits
      # non-zero when it runs long, so slow is a failure here, not a warning.
      # `--groups` gives each module its own collapsible log section, `--verbosity 2`
      # names every case inside it, and `--summary` puts the per-module table on the
      # run page, so a reader learns which contract ran without opening the log.
      - name: Bench-1 offline self-test
        run: |
          python3 evals/benchmark/selftest.py \
            --verbosity 2 --groups --summary "$GITHUB_STEP_SUMMARY"

      # The suite proves the seams; this proves the machine. It drives the fake
      # manifest to a published report, re-runs the hidden verifiers over the
      # finished run, and prints the report as text, so the log shows what the
      # benchmark actually produced rather than only that its tests passed.
      # Fake data throughout: no model, no network, no spend.
      - name: Fake run, manifest to report
        run: |
          set -o pipefail
          run="$RUNNER_TEMP/bench1-fake"
          echo "::group::fake-run"
          python3 -m evals.benchmark.cli fake-run --out "$run"
          echo "::endgroup::"
          echo "::group::verify (hidden verifiers re-run over the finished run)"
          python3 -m evals.benchmark.cli verify --run "$run"
          echo "::endgroup::"
          python3 -m evals.benchmark.cli summary --run "$run" | tee "$RUNNER_TEMP/summary.txt"
          # Belt and braces: the spawn already reaps its own group, and this
          # acts on the run's process ledger rather than on any process name.
          python3 -m evals.benchmark.cli cleanup --run "$run"
          {
            echo '## Bench-1 fake run'
            echo
            echo 'Fake executor, fixed verifier, no model and no spend. The numbers below are'
            echo 'synthetic and exist only to prove the chain from manifest to report.'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
