name: benchmark headline

# Full core experiment: 150 consumer attempts plus 30 natural-arm producers.
# Results remain provisional until metric hardening. GitHub-hosted jobs stop
# at six hours even with a longer timeout; resumable shards are still needed.
on:
  schedule:
    # 03:41 UTC on Sunday. Off the hour and off the canary's slot, and the two
    # lanes share one concurrency group anyway, so neither resets under the
    # other.
    - cron: '41 3 * * 0'
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions: {}

jobs:
  headline:
    # On a pull request this lane is opt-in and costly, so it runs only while
    # both labels are on. Main schedules and explicit dispatch remain available.
    if: >-
      github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft &&
       contains(github.event.pull_request.labels.*.name, 'ci') &&
       contains(github.event.pull_request.labels.*.name, 'benchmark: headline') &&
       (github.event.action != 'labeled' ||
        github.event.label.name == 'ci' || github.event.label.name == 'benchmark: headline'))
    uses: ./.github/workflows/benchmark-shelf.yml
    permissions:
      contents: read
      actions: read
      checks: write
    secrets: inherit
    with:
      manifest: evals/benchmark/fixtures/live/local-arms-manifest.json
      lane: benchmark-headline
      check_name: benchmark headline (core suite)
      timeout_minutes: 720
      budget_note: >-
        Bench-2 full core experiment: ten tasks across every configured arm,
        three repeats, plus the natural arm's producer phase. The overview
        reports actual coverage and verified time/token costs for every arm.
        These are provisional measurements until metric hardening is complete.
