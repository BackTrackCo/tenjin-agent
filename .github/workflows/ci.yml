name: CI

# PR-gated (required check on main) plus manual dispatch for ad-hoc runs.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on rapid pushes / PR updates.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default-deny; the job opts into only what it needs.
permissions: {}

jobs:
  ci:
    # The Node 22 leg keeps the bare name, which is the required check on main.
    # It runs everything. The Node 24 leg runs only build + test: format, lint,
    # typecheck, the bundled-packages check and the audit give the same answer
    # on either Node.
    name: CI (lint, typecheck, build, test, audit)${{ matrix.suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '22'
            suffix: ''
          - node: '24'
            suffix: ' (Node 24)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Check generated workspace guidance integrity
        run: node scripts/check-workspace-adapters.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
        if: matrix.node == '22'
      - run: pnpm lint
        if: matrix.node == '22'
      - run: pnpm typecheck
        if: matrix.node == '22'
      # check = build + test.
      - run: pnpm run check
      # The dist bundles every dependency, so an install's `npm audit` sees none
      # of them. This fails when the packages in dist differ from the committed
      # scripts/bundled-packages.json, so one entering or leaving the bundle
      # shows up in review.
      - run: node scripts/check-bundled-packages.mjs
        if: matrix.node == '22'
      # Supply-chain advisory scan. WARN-ONLY on ordinary PRs: advisories
      # publish against a frozen lockfile, so a blocking gate reds every open PR
      # for drift unrelated to its diff. BLOCKING on the release version PR
      # (changeset-release/main): merging it is the step right before publish,
      # and release.yml's pre-publish gate runs this same audit, so a hit is
      # caught here, before the publish dispatch, not during it. The daily
      # audit.yml opens the fix PR (range-scoped overrides in pnpm-workspace.yaml).
      - name: Audit (blocking on the version PR, warn-only elsewhere)
        if: matrix.node == '22'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if pnpm audit --audit-level=high; then exit 0; fi
          if [ "$HEAD_REF" = "changeset-release/main" ]; then
            echo "::error title=pnpm audit::high/critical advisories would fail the publish gate; merge the audit fix PR (or run the audit workflow), then update this PR"
            exit 1
          fi
          echo "::warning title=pnpm audit::high/critical advisories in the lockfile; the daily audit workflow opens a fix PR"
      # Packed-artifact smoke on the exact engines floor (Node 22.0.0). npm-packs
      # the CLI, installs the tarball into a throwaway consumer, and exercises
      # the PUBLISHED shape (--version, config, a bogus command), catching
      # externalized chunks and missing `files` entries the source-tree tests
      # can't. The floor is Claude Code's own, and the shipped router CLI loads
      # no `node:sqlite`, so nothing above 22.0 is needed. Once, on the 22 leg.
      - name: Set up Node 22.0.0 (engines floor)
        if: matrix.node == '22'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.0.0'
      # Claude Code itself, so the smoke runs `claude plugin validate` and the
      # mod's own tests (`claude plugin test` on hosts/claude/tenjin/tests),
      # which vitest never collects. No bot bumps a version pinned in `run:`, so
      # raise it by hand when a Claude Code release changes `claude plugin`.
      # Installed under the floor Node so it is on PATH for the smoke, which
      # then fails without it.
      - name: Install Claude Code
        if: matrix.node == '22'
        run: npm install -g @anthropic-ai/claude-code@2.1.317 --no-audit --no-fund
      - name: Packed-artifact smoke
        if: matrix.node == '22'
        env:
          PACK_SMOKE_REQUIRE_CLAUDE: '1'
        run: bash scripts/pack-smoke.sh

  # Claude Code runs a plugin's exec-form hooks and its stdio server with no
  # shell, and on Windows only a real executable starts that way. This builds
  # the plugin and spawns each of its commands as Claude Code would. Linux
  # already typechecks, so this job does not.
  windows:
    name: Windows (plugin commands, no shell)
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run src/router/hook-form.test.ts src/router/plugin-files.test.ts
      # `pnpm build` starts with `rm -rf`, which cmd.exe lacks. A fresh checkout has no dist to clear.
      - run: pnpm exec tsup
      - run: node scripts/plugin-spawn-smoke.mjs dist/hosts/claude
      - run: node scripts/installer-smoke.mjs

  installer:
    name: Installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - run: node scripts/installer-smoke.mjs
