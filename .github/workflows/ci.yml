name: CI

# PR-gated (required check on main) plus manual dispatch for ad-hoc runs.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on rapid pushes / PR updates.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default-deny; the job opts into only what it needs.
permissions: {}

jobs:
  ci:
    name: CI (lint, typecheck, build, test, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # check = build + test. Offline contract pins (src/contract.test.ts against
      # the committed fixture) run here; the LIVE walk lives in contract-drift.yml
      # (scheduled + dispatch) so a server blip can never red an unrelated PR.
      - run: pnpm run check
      # Bench-1 (evals/benchmark/) runs no model, no network and no spend, so
      # its offline suite runs here on every PR and a change that breaks the
      # package fails the required check. No path filter: the whole chain is
      # well under a minute. The floor is 3.11; a runner below it is a red run,
      # because a skipped gate reads like a passing one. The package itself is
      # standard-library, which is why the steps below this one call the
      # runner's own `python3`; only the suite installs anything.
      # The live plumbing smoke is benchmark-live.yml, informational only.
      - name: Bench-1 interpreter floor
        run: |
          python3 --version
          python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 11) else 1)' || {
            echo "::error title=python::evals/benchmark needs Python 3.11 or later"
            exit 1
          }
      # pytest, at one exact version and by hash, into a throwaway venv built
      # from the interpreter the step above just checked. A venv rather than a
      # `pip install` because the runner's python3 is externally managed, and
      # `--require-hashes` because a required check must not depend on whatever
      # the index served that minute.
      #
      # Twelve wheels, and `requirements-live.txt` is deliberately not one of
      # them: Harbor is 89 wheels and needs Python 3.12, and this lane starts
      # no container. Nothing under evals/benchmark/ imports it at module
      # scope, so this install is the whole closure the suite needs, and
      # `test_container.py` fails if that ever stops being true.
      - name: Bench-1 test dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/bench1-venv"
          "$RUNNER_TEMP/bench1-venv/bin/python" -m pip install --quiet --require-hashes \
            --only-binary=:all: -r evals/benchmark/requirements-test.txt
          "$RUNNER_TEMP/bench1-venv/bin/python" -m pytest --version
      # The suite is pytest over evals/benchmark/tests/ and takes about 20
      # seconds; the step's own timeout is what bounds it, so the runner owns
      # the clock and the suite owns the result. `--groups` collapses the log
      # section and `--summary` puts the verdict on the run page.
      - name: Bench-1 offline self-test
        timeout-minutes: 2
        run: |
          "$RUNNER_TEMP/bench1-venv/bin/python" evals/benchmark/selftest.py \
            --verbosity 2 --groups --summary "$GITHUB_STEP_SUMMARY"
      # The suite proves the seams; this proves the machine: fake manifest to
      # published report, hidden verifiers re-run over the finished run, the
      # report printed as text. Synthetic numbers throughout.
      - name: Bench-1 fake run, manifest to report
        timeout-minutes: 5
        run: |
          set -o pipefail
          run="$RUNNER_TEMP/bench1-fake"
          echo "::group::fake-run"
          python3 -m evals.benchmark.cli fake-run --out "$run"
          echo "::endgroup::"
          echo "::group::verify (hidden verifiers re-run over the finished run)"
          python3 -m evals.benchmark.cli verify --run "$run"
          echo "::endgroup::"
          python3 -m evals.benchmark.cli summary --run "$run" | tee "$RUNNER_TEMP/bench1-summary.txt"
          python3 -m evals.benchmark.cli cleanup --run "$run"
          {
            echo '## Bench-1 fake run'
            echo
            echo 'Fake executor, fixed verifier, no model and no spend. The numbers below are'
            echo 'synthetic and exist only to prove the chain from manifest to report.'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/bench1-summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Supply-chain advisory scan, WARN-ONLY: advisories publish against a
      # frozen lockfile, so a blocking gate reds every open PR for drift
      # unrelated to its diff. A hit annotates the run; clearing it is a
      # range-scoped override in pnpm-workspace.yaml (see the entries there).
      - name: Audit (warn-only)
        run: |
          pnpm audit --audit-level=high || echo "::warning title=pnpm audit::high/critical advisories in the lockfile; add a range-scoped override in pnpm-workspace.yaml"
      # Packed-artifact smoke on the engines floor (Node 24). npm-packs the
      # CLI, installs the tarball into a throwaway consumer, and exercises the
      # PUBLISHED shape (--version, config, a bogus command) — catching
      # externalized chunks and missing `files` entries the source-tree tests
      # can't. The floor IS Node 24 now (tenjin-agent#209: the hook state store
      # is `node:sqlite`), so this pins the same major the rest of the job uses
      # and stays a separate step because it exercises the packed tarball.
      - name: Set up Node 24 (engines floor)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - name: Packed-artifact smoke
        run: bash scripts/pack-smoke.sh
