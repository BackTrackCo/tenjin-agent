name: CI

# PR-gated (required check on main) plus manual dispatch for ad-hoc runs.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on rapid pushes / PR updates.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default-deny; the job opts into only what it needs.
permissions: {}

jobs:
  ci:
    name: CI (lint, typecheck, build, test, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # check = build + test. Offline contract pins (src/contract.test.ts against
      # the committed fixture) run here; the LIVE walk lives in contract-drift.yml
      # (scheduled + dispatch) so a server blip can never red an unrelated PR.
      - run: pnpm run check
      # Supply-chain advisory scan. WARN-ONLY on ordinary PRs: advisories
      # publish against a frozen lockfile, so a blocking gate reds every open PR
      # for drift unrelated to its diff. BLOCKING on the release version PR
      # (changeset-release/main): merging it is the step right before publish,
      # and release.yml's pre-publish gate runs this same audit, so a hit is
      # caught here, before the publish dispatch, not during it. The daily
      # audit.yml opens the fix PR (range-scoped overrides in pnpm-workspace.yaml).
      - name: Audit (blocking on the version PR, warn-only elsewhere)
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if pnpm audit --audit-level=high; then exit 0; fi
          if [ "$HEAD_REF" = "changeset-release/main" ]; then
            echo "::error title=pnpm audit::high/critical advisories would fail the publish gate; merge the audit fix PR (or run the audit workflow), then update this PR"
            exit 1
          fi
          echo "::warning title=pnpm audit::high/critical advisories in the lockfile; the daily audit workflow opens a fix PR"
      # Packed-artifact smoke on the engines floor (Node 24). npm-packs the
      # CLI, installs the tarball into a throwaway consumer, and exercises the
      # PUBLISHED shape (--version, config, a bogus command) — catching
      # externalized chunks and missing `files` entries the source-tree tests
      # can't. The floor IS Node 24 now (tenjin-agent#209: the hook state store
      # is `node:sqlite`), so this pins the same major the rest of the job uses
      # and stays a separate step because it exercises the packed tarball.
      - name: Set up Node 24 (engines floor)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - name: Packed-artifact smoke
        run: bash scripts/pack-smoke.sh
