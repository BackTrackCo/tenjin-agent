[pytest]
# Bench-1's offline suite. `rootdir` is this directory, so the repository root
# lands on `sys.path` through pytest's own prepend import mode (evals/ carries
# no __init__.py) and `evals.benchmark.*` imports resolve with nothing exported.
testpaths = tests
python_files = test_*.py
addopts = --strict-markers --strict-config -p no:cacheprovider
