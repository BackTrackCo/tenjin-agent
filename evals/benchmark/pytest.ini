[pytest]
# Bench-1's offline suite. `rootdir` is this directory, so the repository root
# lands on `sys.path` through pytest's own prepend import mode (evals/ carries
# no __init__.py) and `evals.benchmark.*` imports resolve with nothing exported.
testpaths = tests
python_files = test_*.py
# `--inline-snapshot=disable` is the default because every lane that runs this
# file is comparing, not rewriting: `snapshot(x)` returns x and the assertion
# stands. Regenerate a golden with an explicit `--inline-snapshot=fix`, which
# overrides this.
addopts = --strict-markers --strict-config -p no:cacheprovider --inline-snapshot=disable
