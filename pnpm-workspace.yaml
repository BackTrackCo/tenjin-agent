# pnpm 11 config file (single-package repo, no workspace globs).

# Overrides: each key is range-scoped to the vulnerable versions and each value is
# a caret floor ('^x.y.z'), the shape `pnpm audit --fix` writes. A caret leaves a
# later patched release reachable; an exact pin froze 3.1.6 in place on
# 2026-09-30 when an advisory named that exact version. The daily audit
# workflow (.github/workflows/audit.yml) opens a PR adding entries like these the
# day an advisory lands.

# Security pin mirrored from the tenjin repo — dropping it reddens
# `pnpm audit` (ws is pulled in via viem).
#
# fast-uri: GHSA-4c8g-83qw-93j6, GHSA-v2hh-gcrm-f6hx, GHSA-7p8r-x3mc-p8w7,
# and the four of 2026-09-23 (GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc,
# GHSA-fph4-wmhf-6fwf, GHSA-jqff-g426-hqxp) that moved the floor to 3.1.6,
# then GHSA-qw65-cvwx-89v3 (floor 3.1.7) and GHSA-58mr-gqgx-xq4g (3.1.6 only)
# of 2026-09-30, which moved it to 3.1.8. Via @modelcontextprotocol/sdk > ajv.
# Drop once ajv's own floor clears 3.1.8.
#
# esbuild: GHSA-g7r4-m6w7-qqqr. Drop once tsup/vitest bump their esbuild
# floor past 0.28.1.
#
# brace-expansion: GHSA-rgw5-rvv9-x895, GHSA-6j4f-fj2g-mc7p (floor 5.0.10) and
# GHSA-qhr7-859c-m2p7 (floor 5.0.11), via eslint/minimatch, dev-only. Drop once
# minimatch's floor clears 5.0.11.
#
# ip-address: GHSA-mwp4-54f8-5fhr (via @modelcontextprotocol/sdk >
# express-rate-limit). Drop once express-rate-limit's floor clears 10.3.1.
#
# nanoid: GHSA-2v37-7h3g-55p8 (floor widened 2026-08-07 from 3.3.17 to 3.3.18,
# stranding the previous pin) and GHSA-28wg-ghj8-5hjv (floor 3.3.16), via
# tsup/vitest > postcss, dev-only. 3.3.18 clears both. Lower-bounded at 3.0.0
# so a 1.x/2.x consumer is never dragged across two majors, which is where
# nanoid's CJS/ESM shape changed. Both advisories also name 4.x/5.x (effective
# floor 5.1.16), deliberately outside this 3.x entry. Drop once the lockfile
# resolves nanoid at 3.3.18+ without this entry.
#
# hono: GHSA-f23p-vx2j-j53r, GHSA-79qm-7rj5-m7r9, GHSA-54fx-42gc-7vw4 (via
# @modelcontextprotocol/sdk, dev-only). Drop once the SDK's floor clears
# 4.12.34.
#
# postcss: GHSA-fxqj-rqcc-2cmp (via tsup/vitest > postcss-load-config,
# dev-only). Drop once tsup's and vite's floors clear 8.5.23.
#
# @hono/node-server: GHSA-frvp-7c67-39w9, Windows-only serve-static path
# traversal, plus the 2.x-line WebSocket-abort memory-leak advisory (floor
# 2.0.10) that `pnpm audit` surfaces once on 2.x. Via
# @modelcontextprotocol/sdk, dev-only; our MCP server is stdio and never
# serves static files or WebSockets. The fix floor is a MAJOR forced under
# the SDK's ^1 range; the suite passes with it. Drop once the SDK depends
# on >=2.0.10 itself.
overrides:
  'ws@>=8.0.0 <8.21.0': '^8.21.0'
  'fast-uri@>=3.0.0 <3.1.8': '^3.1.8'
  'esbuild@>=0.27.3 <0.28.1': '^0.28.1'
  'brace-expansion@>=4.0.0 <5.0.11': '^5.0.11'
  'ip-address@>=10.0.0 <10.3.1': '^10.3.1'
  'nanoid@>=3.0.0 <3.3.18': '^3.3.18'
  'hono@>=3.8.0 <4.12.34': '^4.12.34'
  'postcss@<8.5.23': '^8.5.23'
  '@hono/node-server@<2.0.10': '^2.0.10'
  proxy-addr@>=1.1.0 <2.0.8: ^2.0.8
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  '@modelcontextprotocol/sdk@>=1.12.0 <1.31.0': ^1.31.0

# pnpm 11 errors (ERR_PNPM_IGNORED_BUILDS) on any build-script dep missing an
# entry here, so keep it exhaustive. `false` = don't run the script; esbuild's
# native binary comes from its platform optional-deps.
allowBuilds:
  esbuild: false

minimumReleaseAgeExclude:
  - source-map-js@1.2.2
  - proxy-addr@2.0.8
  - '@modelcontextprotocol/sdk@1.31.0'
